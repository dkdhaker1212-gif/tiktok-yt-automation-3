# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_3                         # unique; used in DB, logs, secret names
    tiktok_username: "nerdstalgic"        # cinematic movie / BTS mini-docs
    youtube_channel_name: "HollywoodFrameLab"  # youtube.com/@hollywoodframelab-w7u
    owner_email: "dineshdhakad0001@gmail.com"

    google_credentials_file: "credentials/channel_3_client_secret.json"
    oauth_token_file: "tokens/channel_3_token.json"

    videos_per_day: 1
    description_footer: ""
    default_tags: [movie facts, behind the scenes, movie trivia, film facts, hollywood,
                   cinema, did you know movies, movie scenes, filmmaking, actors,
                   movie recap, ending explained]
    youtube_category_id: "24"             # 24 Entertainment (1 = Film & Animation)
    enabled: true
    max_retry_days: 7

    content_mode: shorts                  # vertical Shorts, #Shorts tag added
    shorts_max_seconds: 180

    upload_mode: short_only               # 1/day -> newest unposted first
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 2.0                 # gentle for 16:9
      speed: 1.03
      hflip: false
      fade_seconds: 0.4
      sharpen: true
      denoise: false
      saturation: 1.04
      contrast: 1.03
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      brand_overlay:
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr                       # top-right, small
        width_pct: 11
        margin_pct: 3
        opacity: 0.9

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [230, 57, 70]
      hook_templates:
        - "THE ENDING EXPLAINED"
        - "YOU MISSED THIS"
        - "WAIT... WHAT?"
        - "FULL BREAKDOWN"

    slot_publish_times_utc:               # this IS the cron fire time
      1: "12:30"                          # 6:00 PM IST
