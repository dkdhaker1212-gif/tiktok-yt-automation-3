# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_3                         # unique; used in DB, logs, secret names
    tiktok_username: "forjanatalense"     # no @  -- Brazilian blacksmith/bladesmith (Brenno Lima, Natal-RN), forging knives/axes from raw steel. 29.3K followers, no YouTube presence found (checked directly -- only an unrelated namesake, a classical pianist, shows up in YT search). Replicates ch8 Hachazo Perfecto's proven formula (craft/forging process reveal, underserved non-English market) in Portuguese/Brazil instead of Spanish. Swapped in from "Rust & Revival" (ASMR restoration, 0 traction on its own content, paused 2026-09-18).
    youtube_channel_name: "Aco em Chamas"
    owner_email: "dineshdhakad0001@gmail.com"

    google_credentials_file: "credentials/channel_3_client_secret.json"
    oauth_token_file: "tokens/channel_3_token.json"

    videos_per_day: 1
    description_footer: ""
    default_tags: [forja, faca forjada, ferreiro, forja artesanal, cutelaria,
                   faca artesanal, forjando uma faca, damasco, aco, como forjar,
                   satisfatorio, forja de facas, bigorna, trabalho com metal,
                   feito a mao, shorts virais, artesanato, machado forjado]
    youtube_category_id: "24"             # 24 Entertainment (forging / craft content)
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    min_video_seconds: 12                 # skip clips shorter than 12s
    max_video_seconds: 170                # keep it in Shorts range
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    seo_language: "pt"                    # Gemini writes Portuguese title/description/tags
    edit:
      enabled: true
      zoom_crop_pct: 3.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.05
      contrast: 1.05
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 10
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [230, 126, 34]
      hook_templates:
        - "OLHA SO"
        - "DO FERRO A FACA"
        - "VOCE NAO VAI ACREDITAR"
        - "ACO EM BRASA"

    slot_publish_times_utc:               # this IS the cron fire time
      1: "15:30"                          # 9:00 PM IST
