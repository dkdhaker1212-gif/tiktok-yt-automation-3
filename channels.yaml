# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_3                         # unique; used in DB, logs, secret names
    tiktok_username: "REPLACE_SOURCE"     # no @  -- movie recap / explained source
    youtube_channel_name: "HollywoodFrameLab"  # youtube.com/@hollywoodframelab-w7u
    owner_email: "dineshdhakad0001@gmail.com"

    google_credentials_file: "credentials/channel_3_client_secret.json"
    oauth_token_file: "tokens/channel_3_token.json"

    videos_per_day: 1
    description_footer: "Clips used for commentary / recap under fair use. All rights to their owners."
    default_tags: [movie recap, movie explained, ending explained, film breakdown,
                   movie summary, hollywood, cinema, movie in minutes, film analysis,
                   plot explained, movie review, best movie scenes]
    youtube_category_id: "24"             # 24 Entertainment (1 = Film & Animation)
    enabled: true
    max_retry_days: 7

    # --- long-form settings ---
    content_mode: longform               # no #Shorts tag, no vertical assumption
    min_video_seconds: 180               # skip anything under 3 min
    max_video_seconds: 1200              # skip anything over 20 min
    shorts_max_seconds: 180             # (unused in longform mode)

    upload_mode: short_only               # 1/day -> newest unposted first
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 1.0                 # gentle for 16:9
      speed: 1.02
      hflip: false
      fade_seconds: 0.4
      sharpen: true
      denoise: false
      saturation: 1.04
      contrast: 1.03
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      brand_overlay:
        enabled: true
        image: "assets/brand_badge.png"
        corner: br                       # bottom-right, small
        width_pct: 9
        margin_pct: 3
        opacity: 0.9

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [230, 57, 70]
      hook_templates:
        - "THE ENDING EXPLAINED"
        - "YOU MISSED THIS"
        - "WAIT... WHAT?"
        - "FULL BREAKDOWN"

    slot_publish_times_utc:               # this IS the cron fire time
      1: "12:30"                          # 6:00 PM IST
